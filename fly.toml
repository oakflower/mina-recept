# Change `app` to the name you choose in `fly launch`.
app = "mina-recept"
primary_region = "arn"

[build]

[env]
  PORT = "8080"

# Persistent disk for data/recipes.json. Create it once: fly volumes create recipe_data --size 1
[mounts]
  source = "recipe_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
